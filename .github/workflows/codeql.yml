name: CodeQL Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR updates
# do not pile up queued runs against the shared account-wide Actions
# concurrency pool. Safe — read-only analysis, no publish/mutation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeQL `actions` language scans the GitHub Actions workflow
          # files. The repo has no JS/TS/compiled source (pure Agda), so a
          # source-language matrix entry would record zero results; the
          # `actions` language gives a real, non-vacuous scan and satisfies
          # the repo ruleset's code_scanning requirement.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
